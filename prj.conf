CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y

# Accelerometer

CONFIG_I2C=y
CONFIG_LIS2DH=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y

CONFIG_GPIO=y

# Settings - Used to store real-time device configuration to flash.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_CONSOLE=y
CONFIG_MQTT_LOG_LEVEL_DBG=y

CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_FPU=y

CONFIG_EVENTS=y

# PROVA MQTT

# LTE link control
CONFIG_LTE_LINK_CONTROL=y

# Modem library

CONFIG_NRF_MODEM_LIB=y

# Heap and stacks #2048 #8192 #4096

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048 

# Increase AT monitor heap because %NCELLMEAS notifications can be large
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# Network
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=8192 
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y


CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# MQTT
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_PORT=1883 
#CONFIG_ENABLE_SECURE_MQTT=y



# JSON
CONFIG_CJSON_LIB=y

#libraria date time per lettura da internet
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=y


# Enable the watchdog timer
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

CONFIG_MULTITHREADING=y
CONFIG_NUM_COOP_PRIORITIES=16


#per download client library
CONFIG_DOWNLOAD_CLIENT=y
CONFIG_DOWNLOAD_CLIENT_BUF_SIZE=2048
CONFIG_DOWNLOAD_CLIENT_STACK_SIZE=4096


CONFIG_HWINFO=y



#per SD Card
# e SPI NOR





CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_SPI=y
CONFIG_SDMMC_SUBSYS=y

CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_FLASH_LOG_LEVEL_DBG=y

CONFIG_SPI_NOR=y

CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_SECURE_UART=n
CONFIG_TFM_LOG_LEVEL_SILENCE=y



