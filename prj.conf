CONFIG_SENSOR=y
CONFIG_SENSOR_INFO=y

CONFIG_BME680=n
CONFIG_BME68X_IAQ=y

# Settings - Used to store real-time device configuration to flash.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_MQTT_LOG_LEVEL_DBG=y

CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_FPU=y

# PROVA MQTT

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
# Modem library
CONFIG_NRF_MODEM_LIB=y

# Heap and stacks #2048 #8192 #4096
CONFIG_HEAP_MEM_POOL_SIZE=2048 
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048 

# Heap and stacks
#CONFIG_MAIN_STACK_SIZE=2048
# Extended memory heap size needed for encoding REST messages to JSON
#CONFIG_HEAP_MEM_POOL_SIZE=8192
#CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
# Increase AT monitor heap because %NCELLMEAS notifications can be large
#CONFIG_AT_MONITOR_HEAP_SIZE=1024

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# MQTT
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_LIB=y
#CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_HELPER_PORT=1883
# JSON
CONFIG_CJSON_LIB=y
CONFIG_DATE_TIME=y
